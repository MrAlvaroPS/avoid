# Copia EXACTA del default.conf real de WoWAnalyzer/WoWAnalyzer (raíz del
# repo) — mismo fallback a index.html que necesita cualquier SPA con rutas
# de cliente (/report/:code/:fight/:player), sin servir un 404 real para
# assets con hash que ya no existen tras un rebuild.
server {
	listen 80;
	root   /usr/share/nginx/html;
	location /static {
		# Don't fallback to index, but show a 404 error to prevent invalid chunk requests from being cached.
	}
	location / {
		index  index.html index.htm;
		try_files $uri /index.html;
	}
	error_page   500 502 503 504  /50x.html;
}
