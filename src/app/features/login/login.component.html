<div class="login-screen">
  <div class="login-card">
    <img class="login-mark" src="/assets/avoid-guild-logo.png" alt="" aria-hidden="true" />
    <h1>Avoid</h1>

    @if (auth.session() && auth.officerStatus() === 'denied') {
      <p class="login-denied">Tu cuenta de Discord no tiene el rol de Oficial en el servidor de Avoid.</p>
      <button type="button" class="login-btn login-btn-secondary" (click)="onSignOut()">Probar con otra cuenta</button>
    } @else {
      <p class="login-hint">Acceso restringido a Oficiales de Avoid.</p>
      <button type="button" class="login-btn" (click)="onSignIn()">
        <span>Entrar con Discord</span>
      </button>
    }
  </div>
</div>
