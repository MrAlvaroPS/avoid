name: Apply mechanic attribution safety patches

on:
  push:
    branches:
      - fix/mechanic-attribution-safety-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Temporary exact-patch harness: it must disappear before the PR is opened.
      - name: Apply exact responsibility-aware patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          night = 'src/app/core/night-player-summary.service.ts'
          replace_once(
              night,
              "  MechanicCategory,\n  PlayerPullDefensiveEvaluationEvent,",
              "  MechanicCategory,\n  MechanicResponsibility,\n  PlayerPullDefensiveEvaluationEvent,",
          )
          replace_once(
              night,
              "import { PERSONAL_RESPONSIBILITY_CATEGORIES, validAttemptOrdinal } from '../shared/pull-consistency.util';",
              "import { validAttemptOrdinal } from '../shared/pull-consistency.util';",
          )
          replace_once(
              night,
              "import { computeDefensiveManagementScore } from '../../../supabase/functions/_shared/defensive-management-score';\nimport { homogeneousDefensiveEvaluationGeneration } from '../shared/defensive-evaluation-generation';",
              "import { computeDefensiveManagementScore } from '../../../supabase/functions/_shared/defensive-management-score';\nimport { isPunitivePersonalMechanicEvent } from '../../../supabase/functions/_shared/mechanic-attribution';\nimport { homogeneousDefensiveEvaluationGeneration } from '../shared/defensive-evaluation-generation';",
          )
          replace_once(
              night,
              "  category: MechanicCategory | null;\n  rootCause: DeathCause['rootCause'];",
              "  category: MechanicCategory | null;\n  /** Quién controla la resolución; recibir el daño no demuestra autoría del fallo. */\n  responsibility: MechanicResponsibility | null;\n  rootCause: DeathCause['rootCause'];",
          )
          replace_once(
              night,
              "  category: MechanicCategory | null;\n  outcome: 'partial_fail' | 'fail';\n  timeMs: number;\n  damageTaken: number;",
              "  category: MechanicCategory | null;\n  /** Attribution Safety v1: conservado para auditar por qué esta fila sí es personal. */\n  responsibility: MechanicResponsibility | null;\n  outcome: 'partial_fail' | 'fail';\n  timeMs: number;\n  damageTaken: number;",
          )
          replace_once(
              night,
              "  'pull_id, ability_id, mechanic_name, category, outcome, trigger_time_ms, player_hit_details, comparison_source, comparison_percentile';",
              "  'pull_id, ability_id, mechanic_name, category, responsibility, outcome, trigger_time_ms, player_hit_details, comparison_source, comparison_percentile';",
          )
          replace_once(
              night,
              "          category: dc.category ?? null,\n          rootCause: dc.rootCause,",
              "          category: dc.category ?? null,\n          responsibility: dc.responsibility ?? null,\n          rootCause: dc.rootCause,",
          )
          replace_once(
              night,
              "      .filter((ev) => ev.category == null || PERSONAL_RESPONSIBILITY_CATEGORIES.has(ev.category))",
              "      .filter((ev) => isPunitivePersonalMechanicEvent(ev))",
          )
          replace_once(
              night,
              "          category: ev.category,\n          outcome: ev.outcome as 'partial_fail' | 'fail',",
              "          category: ev.category,\n          responsibility: ev.responsibility,\n          outcome: ev.outcome as 'partial_fail' | 'fail',",
          )
          replace_once(
              night,
              "    const patternSource = [\n      ...evaluatedDeaths.map((d) => ({",
              "    const attributableDeaths = evaluatedDeaths.filter((death) =>\n      isPunitivePersonalMechanicEvent({ category: death.category, responsibility: death.responsibility }),\n    );\n    const patternSource = [\n      ...attributableDeaths.map((d) => ({",
          )
          replace_once(
              night,
              "        const rowsForMechanic = [...evaluatedDeaths, ...mechanicFails].filter(",
              "        const rowsForMechanic = [...attributableDeaths, ...mechanicFails].filter(",
          )
          replace_once(
              night,
              "    const actionableDeaths = evaluatedDeaths.filter(\n      (death) => death.category != null && PERSONAL_RESPONSIBILITY_CATEGORIES.has(death.category),\n    );",
              "    const actionableDeaths = attributableDeaths;",
          )
          replace_once(
              night,
              "          row.category != null &&\n          PERSONAL_RESPONSIBILITY_CATEGORIES.has(row.category) &&\n          isVerifiableMechanicName(row.mechanicName),",
              "          isPunitivePersonalMechanicEvent({ category: row.category, responsibility: row.responsibility }) &&\n          isVerifiableMechanicName(row.mechanicName),",
          )
          replace_once(
              night,
              "  category: MechanicCategory | null;\n  outcome: string;\n  trigger_time_ms: number;\n  player_hit_details:",
              "  category: MechanicCategory | null;\n  responsibility: MechanicResponsibility | null;\n  outcome: string;\n  trigger_time_ms: number;\n  player_hit_details:",
          )

          pull = 'src/app/core/pull-analysis.service.ts'
          replace_once(
              pull,
              "import {\n  PERSONAL_RESPONSIBILITY_CATEGORIES,\n  buildAttemptComparison,",
              "import {\n  buildAttemptComparison,",
          )
          replace_once(
              pull,
              "} from '../shared/pull-consistency.util';\n\nexport interface PullHeaderData {",
              "} from '../shared/pull-consistency.util';\nimport { isPunitivePersonalMechanicEvent } from '../../../supabase/functions/_shared/mechanic-attribution';\n\nexport interface PullHeaderData {",
          )
          replace_once(
              pull,
              "    if (ev.category != null && !PERSONAL_RESPONSIBILITY_CATEGORIES.has(ev.category)) continue;",
              "    if (!isPunitivePersonalMechanicEvent(ev)) continue;",
          )
          replace_once(
              pull,
              "          method: `Instancia con outcome='${ev.outcome}' (categoría ${ev.category ?? 'sin clasificar todavía'}); daño = solo el de esta ability sobre este jugador en su ventana de reacción, sanación = recibida durante esa misma ventana, defensivo = cast propio en los ±10s alrededor.`,",
              "          method: `Instancia con outcome='${ev.outcome}' (categoría ${ev.category ?? 'sin clasificar todavía'}, responsibility ${ev.responsibility ?? 'legacy/null'}); Attribution Safety exige responsabilidad personal explícita o fallback histórico antes de señalar al receptor.`,",
          )

          print('Exact patches applied successfully')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused attribution tests
        run: npx vitest run src/app/shared/mechanic-attribution.spec.ts src/app/shared/pull-consistency.util.spec.ts

      - name: Angular build
        run: npm run build

      - name: Commit patched consumers
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/core/night-player-summary.service.ts src/app/core/pull-analysis.service.ts
          git commit -m 'fix: enforce responsibility-aware mechanic attribution'
          git push origin HEAD:fix/mechanic-attribution-safety-v1
