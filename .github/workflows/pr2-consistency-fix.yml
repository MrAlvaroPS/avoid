name: PR2 consistency fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-validate-commit:
    if: github.head_ref == 'fix/pr2-merge-consistency' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply deterministic fixes
        run: node scripts/apply-pr2-consistency-fixes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test MRT codec and cascade
        run: npx vitest run src/app/shared/mrt/mrt-reminder-codec.spec.ts src/app/shared/mrt/auto-assign-cascade.spec.ts

      - name: Type-check changed edge function
        run: deno check supabase/functions/classify-defensives/index.ts

      - name: Angular production build
        run: npm run build

      - name: Diff sanity check
        run: git diff --check

      - name: Commit validated fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve PR2 merge and data consistency issues'
          git push origin HEAD:${{ github.head_ref }}
