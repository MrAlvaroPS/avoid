name: Mechanic replay validation
on:
  push:
    branches: [fix/mechanic-event-replay-current]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install --allow-scripts
      - run: npx vitest run src/app/shared/mechanic-event-attribution.spec.ts src/app/shared/mechanic-event-materialization.spec.ts src/app/shared/mechanic-event-replay-diff.spec.ts
      - run: npm run verify:causal-schema
      - run: npm run verify:causal-runtime
      - run: npm run build
      - name: Deno check replay
        id: deno_check
        shell: bash
        run: |
          set +e
          deno check --node-modules-dir=auto supabase/functions/_shared/mechanic-event-attribution.ts supabase/functions/_shared/mechanic-event-materialization.ts supabase/functions/_shared/mechanic-event-replay-diff.ts supabase/functions/reanalyze-mechanic-events/index.ts 2>&1 | tee /tmp/deno-check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Deno diagnostics to PR
        if: steps.deno_check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Deno check diagnostics'
            echo '```text'
            cat /tmp/deno-check.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 25 --body-file /tmp/comment.md
          exit 1
