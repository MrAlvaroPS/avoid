name: Shadow v7 two-log empirical run

on:
  push:
    branches: [fix/defensive-evidence-claims-shadow-v5]
    paths:
      - '.shadow-v7-launch/20260905-two-log'

jobs:
  shadow-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHADOW_URL: https://qiniulkhivpvbjoquvon.supabase.co/functions/v1/e6-shadow-v7-two-log-4c9d821
    steps:
      - name: Health/version gate
        run: |
          set -euo pipefail
          health="$(curl --retry 3 --retry-all-errors -fsS "$SHADOW_URL?action=health")"
          echo "$health" | jq .
          test "$(echo "$health" | jq -r '.ok')" = "true"
          test "$(echo "$health" | jq -r '.resolver')" = "effective-defensives@2.3.0"
          test "$(echo "$health" | jq -r '.semanticResolver')" = "effective-defensive-semantics@1.5.0"
          test "$(echo "$health" | jq -r '.evaluator')" = "episode-evaluator@7"
          test "$(echo "$health" | jq -r '.reportCodes | length')" = "2"

      - name: Start immutable generation and process 26 canonical pulls
        run: |
          set -euo pipefail
          start="$(curl --retry 3 --retry-all-errors -fsS "$SHADOW_URL?action=start")"
          echo "$start" | jq .
          generation_id="$(echo "$start" | jq -r '.generation.id')"
          test -n "$generation_id"
          test "$generation_id" != "null"
          echo "GENERATION_ID=$generation_id" >> "$GITHUB_ENV"

          done_flag=false
          for i in $(seq 1 28); do
            result="$(curl --retry 3 --retry-all-errors -fsS "$SHADOW_URL?action=process&generation_id=$generation_id")"
            echo "process[$i] $(echo "$result" | jq -c .)"
            if [ "$(echo "$result" | jq -r '.ok')" != "true" ]; then
              echo "Runner returned ok=false"
              exit 1
            fi
            err="$(echo "$result" | jq -r '.error // empty')"
            if [ -n "$err" ]; then
              echo "Pull processing failed: $err"
              exit 1
            fi
            if [ "$(echo "$result" | jq -r '.done // false')" = "true" ]; then
              done_flag=true
              processed="$(echo "$result" | jq -r '.processed')"
              total="$(echo "$result" | jq -r '.total')"
              test "$processed" = "26"
              test "$total" = "26"
              break
            fi
          done

          test "$done_flag" = "true"
          echo "Shadow v7 generation completed: $generation_id"

      - name: Confirm generation remains unpublished
        run: |
          echo "Shadow generation $GENERATION_ID completed. Publication is intentionally not part of this workflow."
