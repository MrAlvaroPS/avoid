name: Prepare Shadow v7 runner

on:
  push:
    branches: [fix/defensive-evidence-claims-shadow-v5]
    paths:
      - '.audit/prepare-shadow-v7'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/defensive-evidence-claims-shadow-v5
          fetch-depth: 0
      - name: Derive v7 runner from reviewed v6 runner
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('supabase/functions/shadow-defensive-v6/index.ts')
          dst = Path('supabase/functions/shadow-defensive-v7/index.ts')
          s = src.read_text()
          replacements = {
            "../_shared/defensive-evidence-v6.ts": "../_shared/defensive-evidence-v7.ts",
            "EFFECTIVE_DEFENSIVE_RESOLVER_VERSION_V6": "EFFECTIVE_DEFENSIVE_RESOLVER_VERSION_V7",
            "EFFECTIVE_DEFENSIVE_SEMANTIC_RESOLVER_VERSION_V6": "EFFECTIVE_DEFENSIVE_SEMANTIC_RESOLVER_VERSION_V7",
            "DEFENSIVE_EPISODE_EVALUATOR_VERSION_V6": "DEFENSIVE_EPISODE_EVALUATOR_VERSION_V7",
            "const RUN_KIND = 'e6_e7_shadow_v6_two_log';": "const RUN_KIND = 'e6_e7_shadow_v7_two_log';",
            "const PREDECESSOR_GENERATION_ID = '079484ef-5436-4412-983f-1142d439d026';": "const PREDECESSOR_GENERATION_ID = '32505e86-185d-4f28-b7dc-225afd2554fa';",
            "Shadow v6": "Shadow v7",
            "v6 hard gate": "v7 hard gate",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'expected marker missing: {old}')
            s = s.replace(old, new)
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/shadow-defensive-v7/index.ts
          git commit -m 'Add immutable Shadow v7 two-log runner'
          git push origin HEAD:fix/defensive-evidence-claims-shadow-v5
