name: E6 defensive shadow run

on:
  push:
    branches:
      - feature/defensive-shadow-e6-e7
    paths:
      - .github/workflows/e6-shadow-run.yml

jobs:
  run-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve generation
        id: start
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://qiniulkhivpvbjoquvon.supabase.co/functions/v1/e6-shadow-28abf632c7d8d2d4'
          OUT="$(curl --fail --silent --show-error "$BASE?action=start")"
          echo "$OUT" | jq .
          GEN="$(echo "$OUT" | jq -r '.generation.id // empty')"
          test -n "$GEN"
          echo "generation_id=$GEN" >> "$GITHUB_OUTPUT"
      - name: Process exactly one normalized pull
        shell: bash
        env:
          GEN: ${{ steps.start.outputs.generation_id }}
        run: |
          set -euo pipefail
          BASE='https://qiniulkhivpvbjoquvon.supabase.co/functions/v1/e6-shadow-28abf632c7d8d2d4'
          OUT="$(curl --fail --silent --show-error "$BASE?action=process&generation_id=$GEN")"
          echo "$OUT" | jq .
          ERR="$(echo "$OUT" | jq -r '.error // empty')"
          if [ -n "$ERR" ]; then
            echo "STOP: resumable E6 error: $ERR" >&2
            exit 2
          fi
