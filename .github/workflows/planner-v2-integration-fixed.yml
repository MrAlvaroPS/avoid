name: Planner v2 integration fixed
on:
  push:
    branches:
      - feature/roster-aware-defensive-planner-v2
permissions:
  contents: write
jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roster-aware-defensive-planner-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix temporary applicator escaping
        run: node .github/scripts/fix-apply-planner-v2.mjs
      - name: Apply planner v2 integration
        run: node .github/scripts/apply-planner-v2.mjs
      - name: Planner + MRT tests
        run: >-
          npx vitest run
          src/app/shared/mrt/effective-defensive.spec.ts
          src/app/shared/mrt/mechanic-occurrences.spec.ts
          src/app/shared/mrt/roster-defensive-planner.spec.ts
          src/app/shared/mrt/auto-assign-cascade.spec.ts
          src/app/shared/mrt/mrt-reminder-codec.spec.ts
      - name: Angular production build
        run: npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit validated implementation
        run: |
          rm -f .github/scripts/apply-planner-v2.mjs .github/scripts/fix-apply-planner-v2.mjs
          rm -f .github/workflows/planner-v2-integration.yml .github/workflows/planner-v2-integration-fixed.yml
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: roster-aware defensive planner v2"
          git push origin HEAD:feature/roster-aware-defensive-planner-v2
