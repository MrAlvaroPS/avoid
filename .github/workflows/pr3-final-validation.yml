name: PR3 final validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/pr2-merge-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Test MRT codec and auto-assignment cascade
        run: npx vitest run --globals src/app/shared/mrt/mrt-reminder-codec.spec.ts src/app/shared/mrt/auto-assign-cascade.spec.ts

      - name: Type-check consistency edge functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/classify-defensives/index.ts
          deno check --node-modules-dir=auto supabase/functions/save-mechanic-defensive-assignment/index.ts

      - name: Angular production build
        run: npm run build

      - name: Diff sanity check
        run: git diff --check
