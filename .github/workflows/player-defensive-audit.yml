name: Player defensive audit
on:
  push:
    branches: [main, feature/player-defensive-audit-narrative]
    paths:
      - 'src/app/core/**'
      - 'src/app/features/night-player-dossier/**'
      - 'supabase/functions/_shared/**defensive-audit**'
      - 'supabase/functions/player-defensive-audit/**'
      - 'supabase/functions/send-discord-message/**'
      - 'supabase/functions/canonical-defensive-refresh/**'
      - 'supabase/migrations/20260908230000_defensive_audit_evidence_v8.sql'
      - 'scripts/verify-player-defensive-audit.mjs'
      - '.github/workflows/player-defensive-audit.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install --allow-scripts
      - run: npx vitest run supabase/functions/_shared/player-defensive-audit.spec.ts
      - run: npm run verify:defensive-audit
      - run: npm run verify:defensive-contract
      - run: npm run verify:causal-schema
      - run: npm run build
      - run: deno check supabase/functions/_shared/player-defensive-audit.ts supabase/functions/player-defensive-audit/index.ts supabase/functions/send-discord-message/index.ts supabase/functions/canonical-defensive-refresh/index.ts

