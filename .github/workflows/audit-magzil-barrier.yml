name: Audit Magzil Barrier WCL evidence

on:
  push:
    branches: [fix/defensive-evidence-claims-shadow-v5]
    paths:
      - '.shadow-v6-launch/magzil-barrier-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact WCL Barrier evidence
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -fsS \
            'https://qiniulkhivpvbjoquvon.supabase.co/functions/v1/e6-audit-magzil-barrier-9a12c4' \
            | tee /tmp/magzil-barrier.json
          echo
          jq . /tmp/magzil-barrier.json
          test "$(jq -r '.ok' /tmp/magzil-barrier.json)" = "true"
