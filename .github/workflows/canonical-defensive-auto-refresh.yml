name: Canonical defensive auto-refresh
on:
  push:
    branches: [fix/canonical-defensive-auto-refresh]
  pull_request:
    paths:
      - 'supabase/migrations/20260908220000_canonical_defensive_auto_refresh.sql'
      - 'supabase/functions/canonical-defensive-auto-refresh/**'
      - 'supabase/functions/_shared/canonical-defensive-auto-refresh*'
      - 'scripts/verify-canonical-defensive-auto-refresh.mjs'
      - '.github/workflows/canonical-defensive-auto-refresh.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install --allow-scripts
      - run: node scripts/verify-canonical-defensive-auto-refresh.mjs
      - run: npx vitest run supabase/functions/_shared/canonical-defensive-auto-refresh.spec.ts
      - run: deno check supabase/functions/canonical-defensive-auto-refresh/index.ts
      - run: npm run build
