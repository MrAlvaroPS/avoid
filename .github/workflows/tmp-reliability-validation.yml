name: Temporary reliability validation
on:
  push:
    branches: [fix/night-report-reliability-read-path]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run --globals src/app/core/reliability.service.spec.ts src/app/core/reliability-canonical-response.spec.ts
      - run: npm run build
