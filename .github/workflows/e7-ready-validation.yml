name: E7 READY validation
on:
  push:
    branches: [feature/mechanics]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install --allow-scripts
      - run: npx vitest run supabase/functions/_shared/defensive-episode-verdict.e7-low-confidence.spec.ts
      - run: npm run verify:defensive-contract
      - run: npm run verify:causal-schema
      - run: npm run verify:causal-runtime
      - run: npm run build
      - run: deno check supabase/functions/_shared/defensive-episode-verdict.ts supabase/functions/_shared/defensive-episode-ledger-events.ts supabase/functions/_shared/defensive-episode-evaluator.ts
