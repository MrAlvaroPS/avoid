name: E7 READY validation
on:
  push:
    branches: [feature/mechanics, fix/defensive-evidence-claims-shadow-v5, feature/dossier-audit-p3-defensives]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install --allow-scripts
      - run: npx vitest run supabase/functions/_shared/defensive-episode-verdict.e7-low-confidence.spec.ts src/app/shared/defensive-evidence-v5.spec.ts src/app/shared/defensive-evidence-v6.spec.ts src/app/shared/defensive-temporal-coverage.spec.ts src/app/shared/defensive-version-identity.spec.ts src/app/shared/protection-divine-shield-final-stand.spec.ts src/app/shared/night-player-audit.spec.ts src/app/core/night-player-pull-ledger.service.spec.ts src/app/core/canonical-defensive-summary.service.spec.ts src/app/core/night-player-defensive-audit.service.spec.ts
      - run: npm run verify:defensive-contract
      - run: npm run verify:causal-schema
      - run: npm run verify:causal-runtime
      - run: npm run build
      - run: deno check supabase/functions/_shared/defensive-episode-verdict.ts supabase/functions/_shared/defensive-episode-ledger-events.ts supabase/functions/_shared/defensive-episode-evaluator.ts supabase/functions/_shared/defensive-temporal-coverage.ts supabase/functions/_shared/defensive-evidence-v6.ts supabase/functions/_shared/defensive-evidence-v7.ts supabase/functions/shadow-defensive-v6/index.ts supabase/functions/shadow-defensive-v7/index.ts
