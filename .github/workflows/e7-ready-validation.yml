name: E7 READY validation
on:
  push:
    branches: [feature/mechanics, fix/defensive-evidence-claims-shadow-v5, fix/canonical-defensive-coaching]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-defensive-coaching
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: npx prettier --write src/app/core/raider-evidence-projection.ts src/app/core/raider-evidence-projection.canonical-coaching.spec.ts src/app/features/night-player-dossier/raider-infographic-v3-canvas.component.html
      - run: npx vitest run src/app/core/raider-evidence-projection.canonical-coaching.spec.ts
      - run: npm run build
      - name: Commit formatted validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/core/raider-evidence-projection.ts src/app/core/raider-evidence-projection.canonical-coaching.spec.ts src/app/features/night-player-dossier/raider-infographic-v3-canvas.component.html
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "Format coaching card implementation"
            git push origin HEAD:fix/canonical-defensive-coaching
          fi
