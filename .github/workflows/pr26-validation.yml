name: PR26 temporary validation
on:
  push:
    branches: [fix/dossier-supabase-read-amplification-main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run src/app/shared/concurrency-limited-fetch.spec.ts
      - run: npm run verify:causal-schema
      - run: npm run verify:causal-runtime
      - run: npm run build
