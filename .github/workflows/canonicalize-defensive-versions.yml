name: Canonicalize defensive versions

on:
  push:
    branches: [fix/defensive-evidence-claims-shadow-v5]
    paths:
      - '.audit/version-canonicalization'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/defensive-evidence-claims-shadow-v5
          fetch-depth: 0
      - name: Make resolver module the version source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/_shared/effective-defensives.ts')
          s = p.read_text()
          old1 = "export const EFFECTIVE_DEFENSIVE_RESOLVER_VERSION = 'effective-defensives@2.2.0';"
          new1 = "export const EFFECTIVE_DEFENSIVE_RESOLVER_VERSION = 'effective-defensives@2.3.0';"
          old2 = "export const EFFECTIVE_DEFENSIVE_SEMANTIC_RESOLVER_VERSION = 'effective-defensive-semantics@1.4.0';"
          new2 = "export const EFFECTIVE_DEFENSIVE_SEMANTIC_RESOLVER_VERSION = 'effective-defensive-semantics@1.5.0';"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected version markers not found exactly; refusing blind edit')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git diff --check
          git diff -- supabase/functions/_shared/effective-defensives.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/_shared/effective-defensives.ts
          git commit -m 'Canonicalize effective defensive resolver versions'
          git push origin HEAD:fix/defensive-evidence-claims-shadow-v5
